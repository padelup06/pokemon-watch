# Configuration utilisée par la surveillance automatique sur GitHub Actions.
# Le webhook Discord vient du secret GitHub POKEWATCH_DISCORD_WEBHOOK, pas de ce fichier.
# Les variables du dépôt POKEWATCH_CODE_POSTAL / POKEWATCH_RAYON_KM, si elles existent,
# remplacent la zone ci-dessous.

[settings]
database = "pokewatch.db"
min_delay_seconds = 3       # La Grande Récré répond 502 si on va trop vite
max_delay_seconds = 5
browser = "never"            # pas de navigateur sur GitHub : Fnac et Cultura y sont bloquées de toute façon
keywords = ["pokemon"]
max_products_per_search = 40
track_discovered = false   # ne relève que vos produits (produits.txt)
watchlist_file = "produits.txt"  # vos produits prioritaires, aussi vérifiés ici (filet de sécurité si le PC est éteint)
# Alpes-Maritimes : centré sur Nice, couvre de Menton à Cannes / Grasse / Mandelieu
# (La Grande Récré Nice, Cagnes, Cannes La Bocca ; JouéClub Nice x2, Monaco, Antibes, Grasse, Mandelieu)
code_postal = "06000"
rayon_km = 45

[alerts]

# Rayon cartes de La Grande Récré : alerte « nouveau produit » uniquement (non suivis ensuite)
[[searches]]
url = "https://www.lagranderecre.fr/cartes-a-collectionner/"
