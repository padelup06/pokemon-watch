# Surveillance sur votre PC :
# - vos produits prioritaires (produits.txt), toutes enseignes, chaque minute ;
# - Cultura (son anti-robot bloque les serveurs, mais laisse passer une vraie fenêtre de
#   navigateur sur une connexion personnelle).
# La Fnac bloque même ainsi (DataDome) : utilisez plutôt l'alerte « M'avertir » de la Fnac.
# Les nouveautés JouéClub et La Grande Récré sont repérées par GitHub (config.ci.toml).

[settings]
database = "pokewatch-pc.db"
interval_minutes = 10            # passage complet
watchlist_file = "produits.txt"   # vos produits prioritaires…
watchlist_interval_seconds = 15   # … revérifiés en continu (repos de 15 s entre deux tours)
parallel = true                   # une enseigne par fil : chaque produit revérifié toutes les ~45-65 s
jitter_seconds = 90
min_delay_seconds = 2
max_delay_seconds = 5
browser = "auto"                 # navigateur pour Cultura, accès direct pour JouéClub / La Grande Récré
browser_visible = true
browser_minimized = true         # fenêtre réduite dans la barre des tâches (ne pas la fermer)
keywords = ["pokemon"]
max_products_per_search = 30
track_discovered = false         # ne surveille que vos produits

# Stock magasin autour de chez vous (06 : Cultura Nice / Mandelieu, JouéClub Nice, Antibes, Grasse…,
# La Grande Récré Nice, Cagnes, Cannes)
code_postal = "06000"
rayon_km = 45

[alerts]
# Rempli automatiquement par 3-surveiller.bat (fichier webhook.txt)

# Aucune page de recherche : seuls VOS produits (produits.txt) sont surveillés.
# Pour être alerté des nouveautés Cultura, décommentez :
# [[searches]]
# url = "https://www.cultura.com/cartes-a-jouer/cartes-pokemon.html"
