# Configuration utilisée par la surveillance automatique sur GitHub Actions.
# Le webhook Discord vient du secret GitHub POKEWATCH_DISCORD_WEBHOOK, pas de ce fichier.
# Les variables du dépôt POKEWATCH_CODE_POSTAL / POKEWATCH_RAYON_KM, si elles existent,
# remplacent la zone ci-dessous.

[settings]
database = "pokewatch.db"
min_delay_seconds = 3       # La Grande Récré répond 502 si on va trop vite
max_delay_seconds = 5
browser = "never"            # pas de navigateur sur GitHub : Fnac et Cultura y sont bloquées de toute façon
keywords = ["pokemon"]
max_products_per_search = 40
track_discovered = false   # ne relève que vos produits (produits.txt)
ean_search_seconds = 900       # recherches par code-barres (Leclerc) : toutes les 15 min, Leclerc limite (HTTP 429)
watchlist_file = "produits.txt"  # vos produits prioritaires, aussi vérifiés ici (filet de sécurité si le PC est éteint)
# Alpes-Maritimes : centré sur Nice, couvre de Menton à Cannes / Grasse / Mandelieu
# (La Grande Récré Nice, Cagnes, Cannes La Bocca ; JouéClub Nice x2, Monaco, Antibes, Grasse, Mandelieu)
code_postal = "06000"
rayon_km = 45
# Zones surveillées en magasin. Chaque zone peut avoir son salon Discord (secret GitHub
# POKEWATCH_ZONE_WEBHOOKS, une ligne « 06=https://discord.com/api/webhooks/… » par zone) ;
# sans salon dédié, ses alertes vont dans le salon principal. Pour ajouter une région :
#   [[settings.zones]]
#   name = "83"
#   code_postal = "83000"
#   rayon_km = 40
zones = [{ name = "06", code_postal = "06000", rayon_km = 45 }]
# Les 13 régions (pokewatch/regions.py), vérifiées à tour de rôle : 2 par passage, chacune
# environ toutes les 30 à 35 min. Le 06 reste vérifié à chaque passage.
regions = true
regions_every_minutes = 30
max_slow_zones_per_run = 2

# Récapitulatif Discord chaque matin (heure de Paris) et alerte si le PC ne tourne plus
recap_hour = 9
watch_pc = true
pc_silence_minutes = 15

[alerts]

# ---- Nouvelles fiches Pokémon : alerte « 🆕 Nouveau produit » (produits ensuite non suivis) ----
# Premier passage de chaque page : silencieux (on note l'existant). Ensuite, toute fiche
# Pokémon jamais vue déclenche une alerte.

# KingDultes (boutique Shopify) : rayon TCG Pokémon, et tout le catalogue (250 dernières
# fiches) pour les nouveautés pas encore rangées dans ce rayon (Duopack, Pokébox…).
[[searches]]
url = "https://www.kingdultes.com/collections/tcg-pokemon/products.json?limit=250"
max = 0

[[searches]]
url = "https://www.kingdultes.com/products.json?limit=250"
title = ["pokemon"]
product_types = ["Cartes à collectionner"]
max = 0

# La Grande Récré : rayon cartes à collectionner et page Nouveautés
[[searches]]
url = "https://www.lagranderecre.fr/cartes-a-collectionner/"
require = ["pokemon"]

[[searches]]
url = "https://www.lagranderecre.fr/nouveautes.html"
require = ["pokemon", "cartes-a-collectionner"]

# JouéClub : pages Nouveautés et coffrets Pokémon (rubrique /pokemon/ = cartes)
[[searches]]
url = "https://www.joueclub.fr/contenu/nouveautes.html"
require = ["/pokemon/"]

[[searches]]
url = "https://www.joueclub.fr/contenu/coffret-pokemon.html"
require = ["/pokemon/"]

# JouéClub : plan du site (toutes les fiches, y compris celles pas encore en vente).
# Fichiers lourds (~9 Mo) mis à jour environ une fois par semaine : relus toutes les 6 h.
[[searches]]
url = "https://www.joueclub.fr/Assets/Rbs/Seo/100185/fr_FR/Rbs_Catalog_Product.1.xml"
require = ["/pokemon/"]
max = 0
every_minutes = 360

[[searches]]
url = "https://www.joueclub.fr/Assets/Rbs/Seo/100185/fr_FR/Rbs_Catalog_Product.2.xml"
require = ["/pokemon/"]
max = 0
every_minutes = 360

[[searches]]
url = "https://www.joueclub.fr/Assets/Rbs/Seo/100185/fr_FR/Rbs_Catalog_Product.3.xml"
require = ["/pokemon/"]
max = 0
every_minutes = 360

[[searches]]
url = "https://www.joueclub.fr/Assets/Rbs/Seo/100185/fr_FR/Rbs_Catalog_Product.4.xml"
require = ["/pokemon/"]
max = 0
every_minutes = 360
