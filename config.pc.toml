# Surveillance sur votre PC : Cultura (son anti-robot bloque les serveurs, mais laisse
# passer une vraie fenêtre de navigateur sur une connexion personnelle).
# La Fnac bloque même ainsi (DataDome) : utilisez plutôt l'alerte « M'avertir » de la Fnac.
# JouéClub et La Grande Récré sont déjà surveillés par GitHub : inutile de les répéter ici.

[settings]
database = "pokewatch-pc.db"
interval_minutes = 10
jitter_seconds = 90
min_delay_seconds = 4
max_delay_seconds = 9
browser = "always"
browser_visible = true
keywords = ["pokemon"]
max_products_per_search = 30

# Stock magasin Cultura autour de chez vous (Cultura Nice et Cultura Mandelieu pour le 06)
code_postal = "06000"
rayon_km = 45

[alerts]
# Rempli automatiquement par 3-surveiller-cultura.bat (fichier webhook.txt)

[[searches]]
url = "https://www.cultura.com/search/results?search_query=pokemon%20carte"
