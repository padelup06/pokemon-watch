# Surveillance sur votre PC :
# - vos produits prioritaires (produits.txt), toutes enseignes, chaque minute ;
# - Cultura (son anti-robot bloque les serveurs, mais laisse passer une vraie fenêtre de
#   navigateur sur une connexion personnelle).
# La Fnac bloque même ainsi (DataDome) : utilisez plutôt l'alerte « M'avertir » de la Fnac.
# Les nouveautés JouéClub et La Grande Récré sont repérées par GitHub (config.ci.toml).

[settings]
database = "pokewatch-pc.db"
interval_minutes = 10            # passage complet
watchlist_file = "produits.txt"   # vos produits prioritaires…
watchlist_interval_seconds = 5    # … revérifiés en continu (repos de 5 s entre deux tours)
parallel = true                   # une enseigne par fil : stock en ligne de chaque produit revérifié toutes les ~25-35 s
jitter_seconds = 90
min_delay_seconds = 2               # entre deux fiches d'une même enseigne (JouéClub freine en dessous)
max_delay_seconds = 4
retailer_delay_seconds = { joueclub = [8, 12] }  # JouéClub renvoie des pages « 429 » en dessous ; GitHub le relève aussi
browser = "auto"                 # navigateur pour Cultura, accès direct pour JouéClub / La Grande Récré
browser_visible = true
browser_minimized = true         # fenêtre réduite dans la barre des tâches (ne pas la fermer)
keywords = ["pokemon"]
max_products_per_search = 30
track_discovered = false         # ne surveille que vos produits

# Stock magasin autour de chez vous (06 : Cultura Nice / Mandelieu, JouéClub Nice, Antibes, Grasse…,
# La Grande Récré Nice, Cagnes, Cannes)
code_postal = "06000"
rayon_km = 45
zones = [{ name = "06", code_postal = "06000", rayon_km = 45 }]  # alertes magasin -> salon #alertes-06 (webhook-06.txt)
# Cultura dans les 13 régions (une seule demande donne tous les magasins de France) ; JouéClub
# et La Grande Récré restent sur le 06 ici, GitHub couvre leurs régions. Salons : webhooks-regions.txt.
regions = true
regions_retailers = ["cultura"]
zone_webhooks_file = "webhooks-regions.txt"
store_check_seconds = 600        # stock magasin : toutes les 10 min par produit (priorité au stock en ligne ; GitHub le relève aussi)
store_error_pause_seconds = 300  # après une erreur de l'API magasin : pause de 5 min pour cette enseigne
ean_search_seconds = 300         # recherches par code-barres (Cultura, Leclerc…) : au plus toutes les 5 min ; pause 15 min après un HTTP 429

# Cultura : rayons Booster, Coffret et Deck Pokémon et « Cartes Pokemon » lus dans leur système,
# plus la recherche du site (les Mini Tin 30 ans, une fiche par visuel, n'y sont pas rangés),
# toutes les 30 min. Seuls les produits 30 ans comptent : alerte quand une nouvelle fiche 30 ans
# apparaît, puis suivi automatique (stock en ligne et dans tous les magasins de France, avec
# quantités). Les autres produits Pokémon de Cultura sont ignorés.
cultura_categories = [46096, 46098, 46097, 30120]
cultura_search_terms = ["pokemon 30e anniversaire", "pokemon 30 ans", "mini tin pokemon 30e anniversaire"]
cultura_discover_minutes = 30
cultura_track = ["30e anniversaire", "30eme anniversaire", "30 ans", "30th"]
cultura_catalog_file = "cultura-catalogue.txt"   # liste des fiches lues (SUIVI = suivie), à envoyer à Claude

heartbeat = true                 # signale à GitHub que le PC tourne (alerte Discord s'il s'arrête)

[alerts]
# Rempli automatiquement par 3-surveiller.bat (fichier webhook.txt)

# Aucune page de recherche : seuls VOS produits (produits.txt) sont surveillés.
# Pour être alerté des nouveautés Cultura, décommentez :
# [[searches]]
# url = "https://www.cultura.com/cartes-a-jouer/cartes-pokemon.html"
